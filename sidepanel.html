<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Domein Research</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="header">
    <div class="header-top">
      <img class="brand-icon" src="icons/logo.png" alt="">
      <div class="brand"><strong>Domein</strong><small>Surface research</small></div>
      <div class="status-stack">
        <div class="header-state" data-state="ready"><i></i><span id="statStatus">Ready</span></div>
        <div id="statusDetail" class="status-detail">Waiting for a site</div>
      </div>
    </div>
    <div class="header-controls">
      <div class="target-input">
        <svg class="ui-icon" aria-hidden="true"><use href="icons/ui/sprite.svg#search"></use></svg>
        <input id="domain" aria-label="Search domain" placeholder="example.com" autocomplete="off" spellcheck="false">
        <button id="activeTab" type="button" title="Use current tab domain" aria-label="Use current tab domain"><svg class="ui-icon"><use href="icons/ui/sprite.svg#scan-search"></use></svg></button>
      </div>
      <button id="start" class="scan-button" type="button"><span>Start scan</span><svg class="ui-icon"><use href="icons/ui/sprite.svg#arrow-right"></use></svg></button>
    </div>
  </header>

  <main>
    <section class="metrics" aria-label="Scan totals">
      <div class="metric"><span><svg class="ui-icon"><use href="icons/ui/sprite.svg#globe"></use></svg>HOSTS</span><strong id="statSubs">—</strong></div>
      <div class="metric"><span><svg class="ui-icon"><use href="icons/ui/sprite.svg#route"></use></svg>ROUTES</span><strong id="statEndpoints">—</strong></div>
      <div class="metric"><span><svg class="ui-icon"><use href="icons/ui/sprite.svg#shield-alert"></use></svg>FINDINGS</span><strong id="statIndicators">—</strong></div>
    </section>

    <section class="results">
      <nav class="tabs" id="tabs" aria-label="Results">
        <button class="tab selected" data-tab="overview"><svg class="ui-icon"><use href="icons/ui/sprite.svg#server"></use></svg>Overview <em id="countOverview">0</em></button>
        <button class="tab" data-tab="subdomains"><svg class="ui-icon"><use href="icons/ui/sprite.svg#globe"></use></svg>Hosts <em id="countSubdomains">0</em></button>
        <button class="tab" data-tab="endpoints"><svg class="ui-icon"><use href="icons/ui/sprite.svg#route"></use></svg>Routes <em id="countEndpoints">0</em></button>
        <button class="tab" data-tab="findings"><svg class="ui-icon"><use href="icons/ui/sprite.svg#shield-alert"></use></svg>Data <em id="countFindings">0</em></button>
        <button class="tab" data-tab="sources"><svg class="ui-icon"><use href="icons/ui/sprite.svg#file-search"></use></svg>Sources <em id="countSources">0</em></button>
        <button class="tab" data-tab="archive"><svg class="ui-icon"><use href="icons/ui/sprite.svg#server"></use></svg>Archive <em id="countArchive">0</em></button>
      </nav>
      <div class="toolbar"><input id="filter" class="filter" placeholder="Filter results"><div class="export-tools"><select id="format" aria-label="Export format"><option value="json">JSON</option><option value="csv">CSV</option><option value="txt">TXT</option></select><button id="export" type="button" class="export-button">Export</button></div></div>
      <div class="panel" id="panel"></div>
    </section>
  </main>
  <footer><span>Results saved in this browser</span><button id="exportTop" type="button">Export JSON <svg class="ui-icon"><use href="icons/ui/sprite.svg#download"></use></svg></button></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
